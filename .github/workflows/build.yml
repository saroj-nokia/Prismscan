name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Release signing secrets (see README). Without them only the debug APK is built.
      HAS_KEYSTORE: ${{ secrets.OPENTUNER_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No gradlew in the repo, so use the version from gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # AGP downloads the API 37 platform on demand once licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # build.gradle.kts expects a debug.keystore in the project root; it is gitignored.
      - name: Create debug keystore
        run: >
          keytool -genkeypair -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Build release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.OPENTUNER_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.OPENTUNER_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPENTUNER_KEY_ALIAS }}
        run: |
          echo "${{ secrets.OPENTUNER_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks" gradle :app:assembleRelease

      - name: Note when release is skipped
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::KEYSTORE_BASE64 secret not set, release APK skipped."

      - uses: actions/upload-artifact@v4
        with:
          name: prismscan-debug
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: prismscan-release
          path: app/build/outputs/apk/release/*.apk
